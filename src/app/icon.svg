<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="nakodaBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242426"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#nakodaBg)" stroke="#38383B" stroke-width="4" filter="url(#softShadow)"/>
  <!-- Bold Modern N Logo Glyph -->
  <text x="256" y="270" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="290" font-weight="900" text-anchor="middle" dominant-baseline="central" letter-spacing="-0.02em">N</text>
</svg>
